[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ISC001",
    # Home Assistant custom components do not carry per-file copyright headers.
    "CPY",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D", "SLF001", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
